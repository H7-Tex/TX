<style>
@font-face { font-family: Bricolage; src: url(/fonts/bricolage.woff2) format("woff2"); font-weight: 200 800; font-display: swap; }
@font-face { font-family: Fragment; src: url(/fonts/fragment-mono.woff2) format("woff2"); font-display: swap; }

:root {
  --bg: #f6f2e9; --ink: #1c1814; --dim: #8a7f6c; --line: #e2dbcc; --card: #fbf8f1; --acc: #a8720c;
  color-scheme: light;
}
:root[data-theme="dark"] { --bg: #17130f; --ink: #ede6da; --dim: #8f8372; --line: #2c251e; --card: #1d1813; --acc: #eab54c; color-scheme: dark; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #17130f; --ink: #ede6da; --dim: #8f8372; --line: #2c251e; --card: #1d1813; --acc: #eab54c; color-scheme: dark; }
}

* { box-sizing: border-box; }
html { background: var(--bg); color: var(--ink); -webkit-text-size-adjust: 100%; transition: background .35s, color .35s; }
body { margin: 0; min-height: 100svh; font-family: Bricolage, system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr auto; }
::selection { background: var(--acc); color: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 1px solid var(--acc); outline-offset: 3px; border-radius: 2px; }

.pop { font-family: Fragment, ui-monospace, monospace; }
.bar { display: flex; justify-content: space-between; gap: 1rem; padding: 1.1rem clamp(1.25rem, 3vw, 2rem); font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
#clock { margin-left: auto; }
.bar button:hover, .bar a:hover { color: var(--ink); }
.bar .on { color: var(--ink); }
.bar a { text-decoration: none; }

main { overflow-x: clip; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: 2rem; padding: 0 clamp(1.25rem, 6vw, 7rem); }
.s { font-size: clamp(1.9rem, 3.55vw, 3.4rem); line-height: 1.16; letter-spacing: -.022em; font-weight: 400; max-width: 14.5em; margin: 0; text-wrap: pretty; }
.k { color: var(--acc); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .14em; text-decoration-color: color-mix(in srgb, var(--acc) 45%, transparent); border-radius: 3px; transition: background .2s; }
.k:hover, .k[aria-expanded="true"] { background: color-mix(in srgb, var(--acc) 12%, transparent); text-decoration-color: var(--acc); }
.art { position: relative; width: 100%; aspect-ratio: 7 / 5; max-height: 62svh; touch-action: pan-y; cursor: grab; -webkit-tap-highlight-color: transparent; user-select: none; }
.art:active { cursor: grabbing; }
.art canvas { position: absolute; left: -14%; top: -14%; width: 128%; height: 128%; display: block; pointer-events: none; }

/* popovers */
.pop { position: absolute; z-index: 10; width: min(23rem, calc(100vw - 2rem)); padding: 1rem 1.1rem; background: var(--card); border: 1px solid var(--line); border-radius: 10px; font-size: 12.5px; line-height: 1.6; box-shadow: 0 18px 50px -24px rgb(0 0 0 / .35); opacity: 0; transform: translateY(4px); transition: opacity .16s, transform .16s; pointer-events: none; }
.pop.open { opacity: 1; transform: none; pointer-events: auto; }
.pop h3 { font: inherit; color: var(--dim); margin: 0 0 .6rem; }
.pop p { margin: 0 0 .6rem; }
.pop :last-child { margin-bottom: 0; }
.pop table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.pop td { padding: .1rem 0; vertical-align: baseline; }
.pop td + td { padding-left: 1ch; }
.pop .r { text-align: right; }
.pop .d { color: var(--dim); }
.pop .a { color: var(--acc); }
.pop a { text-decoration: none; display: inline-flex; gap: .4ch; }
.pop a:hover { color: var(--acc); }
.pop a::after { content: "↗"; color: var(--dim); }
.pop a[href^="mailto"]::after { content: "→"; }
.grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 9px); gap: 2px; margin: .2rem 0 .8rem; }
.grid i { width: 9px; height: 9px; border-radius: 2px; background: var(--ink); }
.big { font-family: Bricolage, sans-serif; font-size: 1.6rem; line-height: 1; color: var(--ink); letter-spacing: -.02em; }

@media (max-width: 820px) {
  main { grid-template-columns: 1fr; align-content: center; gap: 0; padding-top: 1rem; }
  .s { font-size: clamp(1.65rem, 7.4vw, 2.4rem); }
  .art { order: -1; aspect-ratio: 4 / 3; max-height: 38svh; margin-bottom: 1.5rem; }
  .pop { position: fixed; left: .75rem !important; right: .75rem; bottom: .75rem; top: auto !important; width: auto; max-height: 72svh; overflow: auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
const D = {{data}};
const $ = (s, r = document) => r.querySelector(s);
const root = document.documentElement;

/* theme */
const mq = matchMedia('(prefers-color-scheme: dark)');
const current = () => root.dataset.theme || (mq.matches ? 'dark' : 'light');
const paintBar = () => document.querySelectorAll('[data-set]').forEach((b) => b.classList.toggle('on', b.dataset.set === current()));
document.querySelectorAll('[data-set]').forEach((b) => b.addEventListener('click', () => {
  root.dataset.theme = b.dataset.set;
  sound.theme(b.dataset.set);
  try { localStorage.setItem('theme', b.dataset.set); } catch (e) {}
  paintBar();
}));
mq.addEventListener('change', paintBar);
paintBar();

/* sound: synthesized in the browser, off until someone asks for it, and only ever a reply to something they did */
const sound = (() => {
  const NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5]; // c major pentatonic, one note per gold word
  const btn = $('#snd');
  let ac = null, on = false;
  try { on = localStorage.getItem('sound') === 'on'; } catch (e) {}
  const paint = () => { btn.textContent = on ? 'sound on' : 'sound off'; btn.setAttribute('aria-pressed', String(on)); btn.classList.toggle('on', on); };
  const audio = () => {
    if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; ac = new A(); }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  };
  function tone(freq, { dur = 0.16, type = 'triangle', vol = 0.05, at = 0, glide = 0 } = {}) {
    if (!on) return;
    const a = audio();
    if (!a) return;
    const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (glide) o.frequency.exponentialRampToValueAtTime(glide, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t);
    o.stop(t + dur + 0.03);
  }
  btn.addEventListener('click', () => {
    on = !on;
    try { localStorage.setItem('sound', on ? 'on' : 'off'); } catch (e) {}
    paint();
    if (on) NOTES.forEach((f, i) => tone(f, { at: i * 0.055, dur: 0.22, vol: 0.035 }));
  });
  // browsers keep audio asleep until the first gesture
  addEventListener('pointerdown', () => on && audio(), { once: true });
  paint();
  function noise(dur, { vol = 0.06, freq = 1800, q = 0.8, at = 0 } = {}) {
    if (!on) return;
    const a = audio();
    if (!a) return;
    const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 3;
    const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol;
    src.connect(f).connect(g).connect(a.destination);
    src.start(a.currentTime + at);
  }
  return {
    note: (i) => tone(NOTES[i % NOTES.length], { dur: 0.22, vol: 0.045 }),
    theme: (to) => { tone(659.25, { dur: 0.09, type: 'sine', vol: 0.04 }); tone(to === 'light' ? 987.77 : 440, { dur: 0.14, type: 'sine', vol: 0.04, at: 0.07 }); },
    tick: (speed) => tone(1300 + Math.min(1, speed * 6) * 900, { dur: 0.025, type: 'square', vol: 0.012 }),
    thump: () => tone(190, { dur: 0.12, type: 'sine', vol: 0.06, glide: 120 }),
    shatter: () => { noise(0.28, { vol: 0.11, freq: 2400 }); tone(150, { dur: 0.22, type: 'sine', vol: 0.07, glide: 60 }); },
    dock: (k) => tone(NOTES[Math.min(5, Math.floor(k * 6))] * 2, { dur: 0.045, type: 'triangle', vol: 0.016 }),
    lock: () => { tone(523.25, { dur: 0.16, type: 'sine', vol: 0.04 }); tone(783.99, { dur: 0.26, type: 'sine', vol: 0.035, at: 0.06 }); },
  };
})();

/* popovers */
const pop = $('#pop');
let openFor = null, closeT = 0;

/* live bits */
const FINAL = Date.parse('2026-10-24T06:30:00Z'), FINAL_END = Date.parse('2026-10-25T06:30:00Z');
const until = (ms) => { const m = Math.floor(ms / 6e4), d = Math.floor(m / 1440), h = Math.floor(m / 60) % 24; return d ? `${d}d ${h}h` : `${h}h ${m % 60}m`; };
const countdown = () => { const n = Date.now(); return n >= FINAL_END ? 'concluded' : n >= FINAL ? 'live now' : `in ${until(FINAL - n)}`; };
const ord = (p) => p + (['th', 'st', 'nd', 'rd'][(p % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][p % 100] || 'th');
function tick() {
  $('#clock').textContent = `( ${new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Kolkata' })} in chennai )`;
  const c = $('[data-fill="countdown"]', pop); if (c) c.textContent = countdown();
}

const fill = {
  total: (el) => (el.textContent = D.events.length),
  countdown: (el) => (el.textContent = countdown()),
  grid: (el) => {
    el.innerHTML = D.events.map(([title, p]) => {
      const o = p <= 3 ? 1 : p <= 10 ? 0.95 : p <= 50 ? 0.62 : p <= 150 ? 0.36 : 0.16;
      return `<i title="${title.replace(/"/g, '&quot;')}, ${ord(p)}" style="opacity:${o}${p <= 3 ? ';background:var(--acc)' : ''}"></i>`;
    }).join('');
  },
  seasons: (el) => (el.innerHTML = D.seasons.map((s) => `<tr><td>${s.y}</td><td class="r">#${s.world} <span class="d">world</span></td><td class="r">#${s.india} <span class="d">india</span></td><td class="r d">${s.n} events</td></tr>`).join('')),
};
function show(btn) {
  clearTimeout(closeT);
  if (openFor === btn) return;
  sound.note(KEYS.indexOf(btn));
  if (openFor) openFor.setAttribute('aria-expanded', 'false');
  openFor = btn;
  btn.setAttribute('aria-expanded', 'true');
  pop.innerHTML = $('#t-' + btn.dataset.pop).innerHTML;
  pop.querySelectorAll('[data-fill]').forEach((el) => fill[el.dataset.fill](el));
  pop.querySelectorAll('a[href^="http"]').forEach((a) => { a.target = '_blank'; a.rel = 'noopener'; });
  const r = btn.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight, sr = $('.s').getBoundingClientRect();
  let x, y;
  if (innerWidth - sr.right > w + 48) {
    // room beside the sentence: open there, level with the word, so no other word gets covered
    x = sr.right + 32 + scrollX;
    y = Math.max(16, Math.min(r.top - 12, innerHeight - h - 16)) + scrollY;
  } else {
    x = Math.max(16, Math.min(r.left, innerWidth - w - 16)) + scrollX;
    y = (r.bottom + h + 24 > innerHeight && r.top - h - 10 > 0 ? r.top - h - 10 : r.bottom + 10) + scrollY;
  }
  pop.style.left = x + 'px'; pop.style.top = y + 'px';
  pop.classList.add('open');
}
function hide() {
  if (!openFor) return;
  openFor.setAttribute('aria-expanded', 'false');
  openFor = null;
  pop.classList.remove('open');
}
const fine = matchMedia('(hover: hover) and (pointer: fine)');
const KEYS = [...document.querySelectorAll('.k')];
document.querySelectorAll('.k').forEach((b) => {
  b.setAttribute('aria-expanded', 'false');
  b.setAttribute('aria-controls', 'pop');
  b.addEventListener('mouseenter', () => fine.matches && show(b));
  b.addEventListener('mouseleave', () => fine.matches && (closeT = setTimeout(hide, 220)));
  b.addEventListener('click', (e) => { e.stopPropagation(); openFor === b && !fine.matches ? hide() : show(b); });
});
pop.addEventListener('mouseenter', () => clearTimeout(closeT));
pop.addEventListener('mouseleave', () => fine.matches && (closeT = setTimeout(hide, 220)));
pop.addEventListener('click', (e) => e.stopPropagation());
document.addEventListener('click', hide);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && openFor) { const b = openFor; hide(); b.focus(); } });
addEventListener('resize', hide);

tick(); setInterval(tick, 3e4);

/* the mark: H7 built from 46 blocks, extruded into 3D and drawn in characters, lit the way donut.c lit its torus.
   it sways, a ripple runs through it, it turns a full circle now and then. the cursor is its light, and the blocks
   under it part and rise to meet it. drag spins it. a tap breaks it into its blocks, and they find their own way home. */
(function () {
  const box = $('.art'), canvas = $('#art'), ctx = canvas.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  const GLYPH = ['110011011111', '110011000011', '110011000110', '111111001100', '110011011000', '110011011000', '110011011000'];
  const FACE = '+*#%@', SIDE = '.,-~:;=!*#';
  const DEPTH = 1.8, S = 8, OVER = 0.14, TAU = Math.PI * 2; // the canvas overhangs its box by OVER a side, so flying blocks aren't cut off at the edge
  const on = (x, y) => y >= 0 && y < 7 && x >= 0 && x < 12 && GLYPH[y][x] === '1';
  const IDX = GLYPH.map(() => []);
  let count = 0;
  for (let y = 0; y < 7; y++) for (let x = 0; x < 12; x++) if (on(x, y)) IDX[y][x] = ++count;
  const at = (x, y) => (on(x, y) ? IDX[y][x] : 0);
  // one entry per block: home, offset p, velocity v, tilt r, spin w, and surface points [lx, ly, lz, nx, ny, nz, front, neighbour]
  // a side that touches a neighbour (neighbour = its index + 1) only shows once one of the two has moved
  const BLOCKS = [];
  for (let y = 0; y < 7; y++) for (let x = 0; x < 12; x++) {
    if (!on(x, y)) continue;
    const pts = [];
    const face = (n, f, front, nb) => { for (let i = 0; i < S; i++) for (let j = 0; j < S; j++) pts.push([...f((i + 0.5) / S - 0.5, (j + 0.5) / S - 0.5), ...n, front, nb]); };
    face([0, 0, 1], (a, b) => [a, b, DEPTH / 2], 1, 0);
    face([0, 0, -1], (a, b) => [a, b, -DEPTH / 2], 1, 0);
    face([-1, 0, 0], (a, b) => [-0.5, a, b * DEPTH], 0, at(x - 1, y));
    face([1, 0, 0], (a, b) => [0.5, a, b * DEPTH], 0, at(x + 1, y));
    face([0, 1, 0], (a, b) => [a, 0.5, b * DEPTH], 0, at(x, y - 1));
    face([0, -1, 0], (a, b) => [a, -0.5, b * DEPTH], 0, at(x, y + 1));
    BLOCKS.push({ hx: x - 5.5, hy: 3 - y, p: [0, 0, 0], v: [0, 0, 0], r: [0, 0, 0], w: [0, 0, 0], hold: 0, show: -1, away: false, rest: true, sx: 0, sy: 0, hsx: 0, hsy: 0, pts });
  }

  let W, H, BW, BH, cw, ch, cols, rows, zb, raf = 0, visible = true, last = 0, t = 2.2, clock = 0;
  let turn = 0, turnVel = 0, nextTurn = 9, lean = [0, 0], aim = [0, 0], light = [-0.4, 0.45], cursor = null, press = null, userSpin = false, tickAt = 0;
  let view = [1, 0, 1, 0], rings = [], nextPop = 12, pending = 0, total = 0, lastDock = 0;
  function size() {
    const dpr = Math.min(2, devicePixelRatio || 1), r = box.getBoundingClientRect();
    BW = r.width; BH = r.height; W = BW * (1 + 2 * OVER); H = BH * (1 + 2 * OVER);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const fs = Math.max(7.5, Math.min(11, BW / 52));
    ctx.font = `${fs}px Fragment, ui-monospace, monospace`;
    ctx.textBaseline = 'top';
    cw = ctx.measureText('M').width; ch = fs * 1.2;
    cols = Math.floor(W / cw); rows = Math.floor(H / ch);
    zb = new Float32Array(cols * rows);
  }

  // view space (x right, y up, z toward the viewer) back into the model's own space
  const toModel = (x, y, z) => { const [ca, sa, cb, sb] = view, Y = y * cb + z * sb, Z = -y * sb + z * cb; return [x * ca - Z * sa, Y, x * sa + Z * ca]; };

  // a tap: every block near it is thrown outward in a ring around the tap, toward or away from the viewer, tumbling
  function shatter(px, py) {
    if (still.matches) return;
    const R = Math.max(BW, BH) * 0.7;
    pending = 0;
    for (const b of BLOCKS) {
      const dx = b.sx - px, dy = b.sy - py, d = Math.hypot(dx, dy) || 1, f = Math.max(0, 1 - d / R);
      if (f > 0) {
        const out = (5 + 9 * f) * (0.75 + Math.random() * 0.5), deep = (Math.random() * 1.7 - 0.45) * 13 * f;
        const m = toModel((dx / d) * out, (-dy / d) * out, deep);
        for (let i = 0; i < 3; i++) { b.v[i] += m[i]; b.w[i] += (Math.random() - 0.5) * 16 * f; }
        b.hold = clock + 0.3 + (d / R) * 0.35 + Math.random() * 0.15;
        b.away = true;
      }
      if (b.away) pending++;
    }
    total = pending;
    rings.push({ x: px, y: py, t: clock });
    sound.shatter();
    kick();
  }

  // the first time it's drawn, the blocks come in from in front of the screen and land left to right
  function arrive() {
    pending = BLOCKS.length; total = 0;
    for (const b of BLOCKS) {
      b.p = [(Math.random() - 0.5) * 12, (Math.random() - 0.5) * 8, 7 + Math.random() * 5];
      b.r = [(Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6];
      b.hold = b.show = 0.1 + ((b.hx + 5.5) / 11) * 0.55 + Math.random() * 0.12;
      b.away = true; b.rest = false;
    }
  }

  const point = (e) => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  box.addEventListener('pointermove', (e) => {
    const [x, y] = point(e);
    aim = [(x - W / 2) / BW, (y - H / 2) / BH];
    cursor = e.pointerType === 'mouse' ? [x, y] : null;
    if (press) {
      if (!press.moved && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 6) { press.moved = true; userSpin = true; tickAt = turn; sound.thump(); }
      if (press.moved) turnVel += (e.clientX - press.last) * 0.0022;
      press.last = e.clientX;
    }
    kick();
  });
  box.addEventListener('pointerleave', () => { aim = [0, 0]; cursor = null; kick(); });
  box.addEventListener('pointerdown', (e) => { press = { x: e.clientX, y: e.clientY, last: e.clientX, moved: false }; box.setPointerCapture(e.pointerId); kick(); });
  box.addEventListener('pointerup', (e) => { if (press && !press.moved) shatter(...point(e)); press = null; });
  box.addEventListener('pointercancel', () => (press = null));

  function step(dt, moving) {
    const [ca, sa, cb, sb] = view, toward = [-cb * sa, sb, cb * ca]; // toward the viewer, in model space
    const reach = BW * 0.2;
    let busy = false;
    for (const b of BLOCKS) {
      // the cursor parts the blocks around it, and the nearest rise toward the viewer
      let lift = 0, part = [0, 0, 0];
      if (cursor && moving && !press) {
        const dx = b.hsx - cursor[0], dy = b.hsy - cursor[1], d = Math.hypot(dx, dy) || 1, f = Math.max(0, 1 - d / reach);
        lift = f * f * 1.2;
        if (f) part = toModel((dx / d) * f * 1.1, (-dy / d) * f * 1.1, 0);
      }
      if (clock < b.hold) {
        // thrown: drift, slowing, still tumbling
        const k = Math.exp(-2.4 * dt), kw = Math.exp(-1.1 * dt);
        for (let i = 0; i < 3; i++) { b.v[i] *= k; b.w[i] *= kw; }
      } else {
        // home: a spring with a little overshoot, and each tumble unwinds to the nearest whole turn
        for (let i = 0; i < 3; i++) {
          b.v[i] += ((toward[i] * lift + part[i] - b.p[i]) * 52 - b.v[i] * 9.5) * dt;
          b.w[i] += ((Math.round(b.r[i] / TAU) * TAU - b.r[i]) * 38 - b.w[i] * 8.5) * dt;
        }
      }
      // how far it still is from where it wants to be, counting speed and leftover tumble
      let e = 0;
      for (let i = 0; i < 3; i++) {
        b.p[i] += b.v[i] * dt; b.r[i] += b.w[i] * dt;
        e += Math.abs(b.p[i] - toward[i] * lift - part[i]) + Math.abs(b.v[i]) * 0.1 + Math.abs(b.r[i] - Math.round(b.r[i] / TAU) * TAU) + Math.abs(b.w[i]) * 0.1;
      }
      if (b.away && clock >= b.hold && e < 0.08) {
        b.away = false; pending--;
        if (total && clock - lastDock > 0.04) { lastDock = clock; sound.dock(1 - pending / total); }
        if (total && pending === 0) sound.lock();
      }
      b.rest = e < 0.002 && !lift && !part[0] && !part[1] && !part[2];
      if (b.rest) { b.p = [0, 0, 0]; b.v = [0, 0, 0]; b.r = [0, 0, 0]; b.w = [0, 0, 0]; }
      busy ||= !b.rest || lift > 0;
    }
    // now and then, when nothing is happening, one block taps out and back
    if (moving && !cursor && !press && !pending && clock > nextPop) {
      const b = BLOCKS[Math.floor(Math.random() * BLOCKS.length)];
      for (let i = 0; i < 3; i++) { b.v[i] += toward[i] * 6; b.w[i] += (Math.random() - 0.5) * 3; }
      nextPop = clock + 9 + Math.random() * 9;
      busy = true;
    }
    return busy;
  }

  let busy = false;
  function draw(now) {
    const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
    const moving = !still.matches;
    clock += dt;
    if (moving) t += dt;
    // a full turn every so often, unless someone is already spinning it
    if (moving && t > nextTurn && Math.abs(turnVel) < 0.002 && !press) { turnVel += 0.115; nextTurn = t + 11 + Math.random() * 5; }
    turn += turnVel; turnVel *= press?.moved ? 0.85 : 0.955;
    // a ratchet tick every 15 degrees while someone is spinning it by hand
    if (userSpin) {
      if (Math.abs(turn - tickAt) > 0.26) { tickAt = turn; sound.tick(Math.abs(turnVel)); }
      if (!press && Math.abs(turnVel) < 0.004) userSpin = false;
    }
    // once it slows, settle back to facing front
    if (!press?.moved && Math.abs(turnVel) < 0.01) { const home = Math.round(turn / TAU) * TAU; turn += (home - turn) * 0.06; }
    const ease = moving ? 0.08 : 1;
    lean[0] += (aim[0] - lean[0]) * ease; lean[1] += (aim[1] - lean[1]) * ease;
    // the light sits where the cursor is; without one it rests up and to the left
    const lt = cursor ? [-0.4 + aim[0] * 1.8, 0.45 - aim[1] * 1.8] : [-0.4, 0.45];
    light[0] += (lt[0] - light[0]) * ease * 0.9; light[1] += (lt[1] - light[1]) * ease * 0.9;
    const ln = Math.hypot(light[0], light[1], 0.8), Lx = light[0] / ln, Ly = light[1] / ln, Lz = 0.8 / ln;

    const A = (moving ? 0.55 * Math.sin(t * 0.5) : 0.35) + turn + lean[0] * 0.55;
    const B = (moving ? 0.18 * Math.sin(t * 0.33) : 0.12) - 0.08 + lean[1] * 0.4;
    const ca = Math.cos(A), sa = Math.sin(A), cb = Math.cos(B), sb = Math.sin(B);
    view = [ca, sa, cb, sb];
    busy = step(dt, moving);
    const dist = 18, K = Math.min(BW * 0.76, BH * 1.02) * dist / 12.5, cx = W / 2, cy = H / 2;
    const dark = current() === 'dark';
    zb.fill(0);
    const cells = new Map();
    for (const b of BLOCKS) {
      const alpha = Math.max(0, Math.min(1, (clock - b.show) / 0.35));
      if (!alpha) { b.sx = b.sy = -1e4; continue; }
      let m = null;
      if (!b.rest) {
        const [rx, ry, rz] = b.r, cx_ = Math.cos(rx), sx_ = Math.sin(rx), cy_ = Math.cos(ry), sy_ = Math.sin(ry), cz = Math.cos(rz), sz = Math.sin(rz);
        m = [cy_ * cz, sx_ * sy_ * cz - cx_ * sz, cx_ * sy_ * cz + sx_ * sz, cy_ * sz, sx_ * sy_ * sz + cx_ * cz, cx_ * sy_ * sz - sx_ * cz, -sy_, sx_ * cy_, cx_ * cy_];
      }
      const ox = b.hx + b.p[0], oy = b.hy + b.p[1], oz = b.p[2];
      {
        // where the block sits on screen, and where its home is, for the cursor and for taps
        const X = ox * ca + oz * sa, Z = -ox * sa + oz * ca, Y2 = oy * cb - Z * sb, Z2 = oy * sb + Z * cb, o = 1 / (dist - Z2);
        b.sx = cx + X * K * o; b.sy = cy - Y2 * K * o;
        const hX = b.hx * ca, hZ = -b.hx * sa, hY = b.hy * cb - hZ * sb, hO = 1 / (dist - (b.hy * sb + hZ * cb));
        b.hsx = cx + hX * K * hO; b.hsy = cy - hY * K * hO;
      }
      for (const pt of b.pts) {
        if (pt[7] && b.rest && BLOCKS[pt[7] - 1].rest) continue;
        let lx = pt[0], ly = pt[1], lz = pt[2], nx0 = pt[3], ny = pt[4], nz0 = pt[5];
        if (m) {
          const ax = lx, ay = ly, az = lz, bx = nx0, by = ny, bz = nz0;
          lx = m[0] * ax + m[1] * ay + m[2] * az; ly = m[3] * ax + m[4] * ay + m[5] * az; lz = m[6] * ax + m[7] * ay + m[8] * az;
          nx0 = m[0] * bx + m[1] * by + m[2] * bz; ny = m[3] * bx + m[4] * by + m[5] * bz; nz0 = m[6] * bx + m[7] * by + m[8] * bz;
        }
        const x0 = ox + lx, y = oy + ly;
        // ripple: the glyph bends along its length like cloth in a breeze; the phase stays pinned to each block's home
        const ph = 0.75 * (b.hx + pt[0]) - t * 2.1 + (b.hy + pt[1]) * 0.25;
        const w = moving ? 0.32 * Math.sin(ph) : 0, slope = moving ? 0.24 * Math.cos(ph) : 0;
        const z = oz + lz + w, nx = nx0 - slope * nz0, nz = nz0 + slope * nx0;
        const X = x0 * ca + z * sa, Z = -x0 * sa + z * ca;
        const Y2 = y * cb - Z * sb, Z2 = y * sb + Z * cb;
        if (dist - Z2 < 3) continue;
        const NX = nx * ca + nz * sa, NZ = -nx * sa + nz * ca;
        const NY2 = ny * cb - NZ * sb, NZ2 = ny * sb + NZ * cb;
        const ooz = 1 / (dist - Z2);
        const c = Math.floor((cx + X * K * ooz) / cw), r = Math.floor((cy - Y2 * K * ooz) / ch);
        if (c < 0 || c >= cols || r < 0 || r >= rows) continue;
        const i = r * cols + c;
        if (ooz <= zb[i]) continue;
        zb[i] = ooz;
        const L = Math.max(0, Math.min(0.999, 0.5 + 0.5 * (NX * Lx + NY2 * Ly + NZ2 * Lz)));
        cells.set(i, pt[6] ? [FACE[Math.floor(L * FACE.length)], 1, alpha] : [SIDE[Math.floor((dark ? L : 1 - L) * SIDE.length)], 0, alpha * 0.7]);
      }
    }
    const css = getComputedStyle(root), ink = css.getPropertyValue('--ink'), acc = css.getPropertyValue('--acc');
    ctx.clearRect(0, 0, W, H);
    for (const [i, [g, f, a]] of cells) {
      ctx.fillStyle = f ? acc : ink;
      ctx.globalAlpha = a;
      ctx.fillText(g, (i % cols) * cw, Math.floor(i / cols) * ch);
    }
    // the ring a tap leaves: a circle of dots running out from it, behind the blocks
    ctx.fillStyle = ink;
    rings = rings.filter((g) => {
      const age = clock - g.t, R = age * BW * 1.5, max = BW * 0.85;
      if (R > max) return false;
      ctx.globalAlpha = 0.8 * (1 - R / max);
      const n = Math.max(12, Math.floor((TAU * R) / (cw * 1.7)));
      for (let k = 0; k < n; k++) {
        const c = Math.floor((g.x + Math.cos((k / n) * TAU) * R) / cw), r = Math.floor((g.y + Math.sin((k / n) * TAU) * R) / ch);
        if (c >= 0 && c < cols && r >= 0 && r < rows && !cells.has(r * cols + c)) ctx.fillText('·', c * cw, r * ch);
      }
      return true;
    });
    ctx.globalAlpha = 1;
  }
  // one loop at a time; theme changes and resizes just ask for the next frame
  const loop = (now) => { raf = 0; draw(now); if (visible && (!still.matches || busy || rings.length || Math.abs(turnVel) > 0.001 || press)) raf = requestAnimationFrame(loop); };
  const kick = () => { if (!raf) raf = requestAnimationFrame(loop); };
  new IntersectionObserver(([e]) => { visible = e.isIntersecting && !document.hidden; if (visible) kick(); }).observe(box);
  document.addEventListener('visibilitychange', () => { visible = !document.hidden; if (visible) kick(); });
  addEventListener('resize', () => { size(); kick(); });
  mq.addEventListener('change', kick);
  still.addEventListener('change', kick);
  document.querySelectorAll('[data-set]').forEach((b) => b.addEventListener('click', kick));
  document.fonts.ready.then(() => { size(); if (!still.matches) arrive(); kick(); });
})();
</script>
</body>
</html>
